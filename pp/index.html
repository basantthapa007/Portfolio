<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Online PowerPoint Presentation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1e1e1e;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #2d2d2d;
      color: #ffffff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header h1 {
      font-size: 1.1rem;
    }
    .fullscreen-btn {
      background-color: #0078d4;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .fullscreen-btn:hover {
      background-color: #005a9e;
    }
    iframe {
      width: 100%;
      flex-grow: 1;
      border: none;
    }
  </style>
</head>
<body>

  <script>
    // --- ACCESS CODE CONFIGURATION ---
    const SECRET_CODE = "123456"; // Change this to your desired 6-digit code
    const REDIRECT_URL = "https://basantthapa.com.np";

    // Prompt user for 6-digit passcode on page load
    const userPass = prompt("Enter 6-digit passcode to view presentation:");

    if (userPass === SECRET_CODE) {
      alert("Welcome! Access granted.");
    } else {
      alert("Incorrect passcode! Redirecting...");
      window.location.href = REDIRECT_URL;
    }
  </script>

  <div class="container">
    <header>
      <h1>Presentation Viewer</h1>
      <button class="fullscreen-btn" onclick="toggleFullscreen()">Fullscreen Mode</button>
    </header>
    
    <!-- Microsoft Office Web Viewer Embed -->
    <iframe 
      id="presentation-frame"
      src=""
      allowfullscreen="true" 
      mozallowfullscreen="true" 
      webkitallowfullscreen="true">
    </iframe>
  </div>

  <script>
    // Raw URL of your PowerPoint file on GitHub
    const RAW_PPTX_URL = "https://raw.githubusercontent.com/basantthapa007/Portfolio/main/pp/Every%20morning%20I%20wake.pptx";

    // Pass through Microsoft Office Online viewer API
    const viewerUrl = `https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(RAW_PPTX_URL)}`;

    // Set iframe source
    document.getElementById("presentation-frame").src = viewerUrl;

    // Fullscreen toggle handler
    function toggleFullscreen() {
      const iframe = document.getElementById("presentation-frame");
      if (iframe.requestFullscreen) {
        iframe.requestFullscreen();
      } else if (iframe.webkitRequestFullscreen) {
        iframe.webkitRequestFullscreen();
      } else if (iframe.msRequestFullscreen) {
        iframe.msRequestFullscreen();
      }
    }
  </script>

</body>
</html>
